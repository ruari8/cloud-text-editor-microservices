image: rust:1.75

stages:
  - test
  - build

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse 

cache:
  paths:
    - .cargo
    - target/

test:
  stage: test
  script:
    - rustc --version
    - cargo --version
    - cargo test --verbose

build:
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/average-word-length
